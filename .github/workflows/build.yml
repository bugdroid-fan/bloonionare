name: Build Legacy 32-bit App

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Prerequisites
        run: brew install ldid

      - name: Install Theos Toolchain
        run: |
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Download iOS 9.3 SDK (Direct Minimal Link)
        run: |
          mkdir -p ~/theos/sdks
          curl -L -o ~/theos/sdks/iPhoneOS9.3.sdk.tar.xz https://github.com
          tar -xf ~/theos/sdks/iPhoneOS9.3.sdk.tar.xz -C ~/theos/sdks/
          rm ~/theos/sdks/iPhoneOS9.3.sdk.tar.xz

      - name: Compile Application
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1

      - name: Pack IPA Bundle
        run: |
          mkdir -p Payload
          cp -r .theos/obj/*.app Payload/
          zip -r ImABloonionare.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Im-A-Bloonionare
          path: ImABloonionare.ipa
