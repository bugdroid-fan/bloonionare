name: Build Legacy 32-bit App

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compiler Requirements
        run: brew install ldid

      - name: Download Theos Toolchain
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: manual-theos
          submodules: recursive

      - name: Download Legacy iOS 3.0 SDK (Direct Minimal Link)
        run: |
          mkdir -p manual-sdks
          curl -L -o manual-sdks/iPhoneOS3.0.sdk.tar.xz https://github.com
          tar -xf manual-sdks/iPhoneOS3.0.sdk.tar.xz -C manual-sdks/
          rm manual-sdks/iPhoneOS3.0.sdk.tar.xz

      - name: Assemble Workspace Folders
        run: |
          mkdir -p ~/theos
          cp -r manual-theos/* ~/theos/ || true
          cp -r manual-theos/.* ~/theos/ || true
          mkdir -p ~/theos/sdks
          mv manual-sdks/iPhoneOS3.0.sdk ~/theos/sdks/
          rm -rf manual-sdks manual-theos

      - name: Compile Application (Local Engine Mapping)
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS=~/theos SDKROOT=~/theos/sdks/iPhoneOS3.0.sdk

      - name: Pack IPA Bundle
        run: |
          mkdir -p Payload
          cp -r .theos/obj/*.app Payload/
          zip -r ImABloonionare.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Im-A-Bloonionare
          path: ImABloonionare.ipa
