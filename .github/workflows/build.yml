name: Build Legacy 32-bit App

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compiler Requirements
        run: brew install ldid

      - name: Download iOS 9.3 SDK
        uses: actions/checkout@v4
        with:
          repository: xybp888/iOS-SDKs
          path: manual-sdks
          sparse-checkout: iPhoneOS9.3.sdk
          sparse-checkout-cone-mode: false

      - name: Download Theos Toolchain
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: manual-theos
          submodules: recursive

      - name: Assemble Workspace Folders
        run: |
          mkdir -p ~/theos
          cp -r manual-theos/* ~/theos/ || true
          cp -r manual-theos/.* ~/theos/ || true
          mkdir -p ~/theos/sdks
          mv manual-sdks/iPhoneOS9.3.sdk ~/theos/sdks/
          rm -rf manual-sdks manual-theos

      - name: Patch Missing Linker Stub
        run: |
          mkdir -p ~/theos/sdks/iPhoneOS9.3.sdk/usr/lib/system
          echo -e "---\narchs: [ armv7, armv7s, arm64 ]\nplatform: ios\ninstall-name: /usr/lib/system/liblaunch.dylib\nexports:\n  - archs: [ armv7, armv7s, arm64 ]\n    symbols: [ _launch_activate_socket ]\n..." > ~/theos/sdks/iPhoneOS9.3.sdk/usr/lib/system/liblaunch.tbd

      - name: Compile Application (Local Engine Mapping)
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS=~/theos SDKROOT=~/theos/sdks/iPhoneOS9.3.sdk

      - name: Pack IPA Bundle
        run: |
          mkdir -p Payload
          cp -r .theos/obj/*.app Payload/
          zip -r ImABloonionare.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Im-A-Bloonionare
          path: ImABloonionare.ipa
